name: CI

on:
  push:
    branches: [PythonADCD, main, develop]
  pull_request:
    branches: [PythonADCD, main]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package (editable) + dev dependencies
        run: pip install -e ".[dev]"

      - name: Verify CLI entrypoints
        run: |
          adcd --version
          adcd list-scenarios
          adcd list-taxonomy

      - name: Run pytest unit tests
        run: pytest tests/ -q --tb=short

      - name: Run ADCD 4-Step Validation Suite
        env:
          PYTHONPATH: src
        run: python src/adcd/run_adcd_v3_validation_blind.py --top-k 5

  build-paper:
    name: Compile LaTeX Paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/main.tex
          work_in_root_file_dir: true
          extra_system_packages: "py-pygments"

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: ADCD-paper-${{ github.sha }}
          path: paper/main.pdf
          retention-days: 30
