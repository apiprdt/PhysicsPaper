[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adcd"
version = "1.0.0"
description = "ADCD: Asymptotic Dictionary Correction Discovery for Identifiable Symbolic Regression"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Afif Erdita", email = "maeapip10@gmail.com" }
]
keywords = ["symbolic regression", "physics", "machine learning", "scientific discovery", "JAX", "identifiability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "sympy>=1.12",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pandas>=1.5",
    "pint>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "flake8>=6.1",
    "black>=23.0",
    "jupyter>=1.0",
]

# Primary comparison baseline (PySR pulls in a Julia runtime; only needed to
# re-run the baseline benchmark, not for ADCD itself).
benchmark = [
    "pysr>=1.5",
]
all = ["adcd[dev,benchmark]"]

[project.urls]
Homepage = "https://github.com/apiprdt/PhysicsPaper"
Repository = "https://github.com/apiprdt/PhysicsPaper"
"Bug Tracker" = "https://github.com/apiprdt/PhysicsPaper/issues"
"NeurIPS 2026" = "https://neurips.cc/virtual/2026/loc/paris/180051"

[project.scripts]
adcd = "adcd.cli:main"
adcd-validate = "adcd.run_adcd_v3_validation_blind:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
filterwarnings = [
    # matplotlib emits DeprecationWarning when plt.show() is called on a
    # non-interactive (Agg) backend. This is a third-party warning not under
    # our control; we already guard plt.show() with plt.isinteractive().
    "ignore:FigureCanvasAgg is non-interactive:DeprecationWarning",
]

[tool.coverage.run]
source = ["adcd"]
omit = ["tests/*", "scratch/*"]

[tool.black]
line-length = 120
target-version = ["py310", "py311"]
